version: "3.8"

services:
  # ============================================================================
  # Local PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: woka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-woka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woka_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-woka_reel_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woka} -d ${POSTGRES_DB:-woka_reel_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Local Redis Cache & Task Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: woka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # FastAPI Backend (Python 3.10+)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: woka-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql://${POSTGRES_USER:-woka}:${POSTGRES_PASSWORD:-woka_dev_password_2026}@postgres:5432/${POSTGRES_DB:-woka_reel_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-woka-dev-secret-key-at-least-32-chars-long-2026}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-N0NlbmRfdG9rZW5fZW5jcnlwdGlvbl9zdGFnaW5nOTk=}
      - META_APP_ID=${META_APP_ID:-mock_meta_app_id_12345}
      - META_APP_SECRET=${META_APP_SECRET:-mock_meta_app_secret_67890}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-woka_local_webhook_verify_token_2026}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-data:/app/media_storage

  # ============================================================================
  # Next.js Frontend (React 18 / Tailwind)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: woka-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend-data:
